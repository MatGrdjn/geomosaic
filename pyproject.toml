[project]
name = "geomosaic" 
version = "0.2.0"
description = "A Python CLI tool to convert images into a SVG mosaics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "GRANDJEAN Mathieu", email = "mathieu.grandjean@etu.imt-nord-europe.fr" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=2.4.3",
    "pillow>=9.0.0",
]

[dependency-groups]
dev = [
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]

[tool.mypy]
exclude = ["^notebooks/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geomosaic"]

[project.scripts]
geomosaic = "geomosaic.cli:main"